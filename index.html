<meta charset="utf-8">
<title>코비코 프롬프트 키트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:#182028;
    --ink-soft:#485460;
    --paper:#eef1f3;
    --surface:#ffffff;
    --surface-2:#e4e9ec;
    --rule:#c9d2d8;
    --steel:#2e5266;
    --steel-deep:#1c3644;
    --steel-tint:#e7eef2;
    --safety:#c96a1e;
    --safety-ink:#ffffff;
    --safety-tint:#fbe8d4;
    --ok:#3c7a5a;
    --code-bg:#0f1a20;
    --code-ink:#dce7ea;
    --code-accent:#7fb3c9;
    --shadow: 0 1px 2px rgba(20,30,38,.06), 0 6px 16px -8px rgba(20,30,38,.18);
    --radius: 10px;
  }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#e7ecef;
      --ink-soft:#a9b4bc;
      --paper:#0f151a;
      --surface:#161e24;
      --surface-2:#1e2932;
      --rule:#2b3941;
      --steel:#7fb3c9;
      --steel-deep:#bcdbe8;
      --steel-tint:#1a2c34;
      --safety:#e2953f;
      --safety-ink:#1a1206;
      --safety-tint:#2e2214;
      --ok:#6fbf95;
      --code-bg:#0a1115;
      --code-ink:#d7e3e7;
      --code-accent:#7fb3c9;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 24px -10px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"]{
    --ink:#e7ecef;
    --ink-soft:#a9b4bc;
    --paper:#0f151a;
    --surface:#161e24;
    --surface-2:#1e2932;
    --rule:#2b3941;
    --steel:#7fb3c9;
    --steel-deep:#bcdbe8;
    --steel-tint:#1a2c34;
    --safety:#e2953f;
    --safety-ink:#1a1206;
    --safety-tint:#2e2214;
    --ok:#6fbf95;
    --code-bg:#0a1115;
    --code-ink:#d7e3e7;
    --code-accent:#7fb3c9;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 24px -10px rgba(0,0,0,.55);
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"IBM Plex Sans","Malgun Gothic",sans-serif;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--safety-tint); color:var(--ink); }

  a{ color:inherit; }

  .wrap{
    max-width:1180px;
    margin:0 auto;
    padding:0 24px 96px;
  }

  /* ---------- Header ---------- */
  header.hero{
    padding:56px 24px 40px;
    border-bottom:1px solid var(--rule);
    background:
      linear-gradient(180deg, var(--steel-tint), transparent 140px);
  }
  .hero-inner{
    max-width:1180px;
    margin:0 auto;
  }
  .eyebrow{
    font-family:"IBM Plex Mono",monospace;
    font-size:12.5px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--steel);
    font-weight:600;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .eyebrow::before{
    content:"";
    width:22px;height:1px;
    background:var(--steel);
    display:inline-block;
  }
  h1{
    font-family:"IBM Plex Sans Condensed",sans-serif;
    font-weight:700;
    font-size:clamp(34px,5vw,54px);
    line-height:1.04;
    letter-spacing:-.01em;
    margin:14px 0 12px;
    text-wrap:balance;
    color:var(--ink);
  }
  .hero p.lede{
    max-width:62ch;
    font-size:16.5px;
    color:var(--ink-soft);
    margin:0 0 26px;
  }
  .hero-meta{
    display:flex;
    flex-wrap:wrap;
    gap:10px 28px;
    font-family:"IBM Plex Mono",monospace;
    font-size:13px;
    color:var(--ink-soft);
  }
  .hero-meta strong{
    color:var(--ink);
    font-weight:600;
  }
  .disclaimer{
    margin-top:28px;
    padding:12px 16px;
    border:1px solid var(--rule);
    border-radius:8px;
    background:var(--surface);
    font-size:13px;
    color:var(--ink-soft);
    max-width:72ch;
  }

  /* ---------- Session nav ---------- */
  nav.sessions{
    position:sticky;
    top:0;
    z-index:20;
    background:var(--paper);
    border-bottom:1px solid var(--rule);
    backdrop-filter:blur(6px);
  }
  .sessions-inner{
    max-width:1180px;
    margin:0 auto;
    padding:0 24px;
    display:flex;
    gap:4px;
    overflow-x:auto;
  }
  .tab-btn{
    appearance:none;
    border:none;
    background:transparent;
    font-family:"IBM Plex Sans Condensed",sans-serif;
    font-weight:600;
    font-size:15.5px;
    color:var(--ink-soft);
    padding:16px 18px 13px;
    cursor:pointer;
    border-bottom:3px solid transparent;
    white-space:nowrap;
    transition:color .15s ease, border-color .15s ease;
  }
  .tab-btn .count{
    font-family:"IBM Plex Mono",monospace;
    font-size:11.5px;
    font-weight:500;
    color:var(--ink-soft);
    margin-left:7px;
    opacity:.75;
  }
  .tab-btn:hover{ color:var(--ink); }
  .tab-btn[aria-selected="true"]{
    color:var(--steel-deep);
    border-bottom-color:var(--safety);
  }
  .tab-btn:focus-visible{ outline:2px solid var(--steel); outline-offset:-2px; }

  /* ---------- Chapter jump chips ---------- */
  .chapter-jump{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin:28px 0 8px;
  }
  .chapter-jump a{
    text-decoration:none;
    font-family:"IBM Plex Mono",monospace;
    font-size:12.5px;
    color:var(--steel-deep);
    background:var(--steel-tint);
    border:1px solid var(--rule);
    padding:6px 12px;
    border-radius:999px;
  }
  .chapter-jump a:hover{ border-color:var(--steel); }

  /* ---------- Session panel ---------- */
  .panel{ display:none; padding-top:8px; }
  .panel.is-active{ display:block; }

  .session-intro{
    margin:32px 0 6px;
    padding:18px 20px;
    border-left:3px solid var(--steel);
    background:var(--surface);
    border-radius:0 8px 8px 0;
    box-shadow:var(--shadow);
  }
  .session-intro h2{
    font-family:"IBM Plex Sans Condensed",sans-serif;
    font-size:21px;
    margin:0 0 6px;
    color:var(--ink);
  }
  .session-intro p{
    margin:0;
    color:var(--ink-soft);
    font-size:14.5px;
  }
  .session-intro .files{
    margin-top:10px;
    display:flex;
    flex-wrap:wrap;
    gap:6px;
  }
  .file-chip{
    font-family:"IBM Plex Mono",monospace;
    font-size:11.5px;
    background:var(--surface-2);
    color:var(--ink-soft);
    border-radius:5px;
    padding:3px 8px;
  }

  .chapter{
    margin-top:46px;
    scroll-margin-top:70px;
  }
  .chapter-head{
    display:flex;
    align-items:baseline;
    gap:12px;
    border-bottom:1px solid var(--rule);
    padding-bottom:10px;
    margin-bottom:20px;
  }
  .chapter-num{
    font-family:"IBM Plex Mono",monospace;
    font-size:13px;
    color:var(--safety);
    font-weight:600;
    letter-spacing:.02em;
  }
  .chapter-head h3{
    font-family:"IBM Plex Sans Condensed",sans-serif;
    font-size:24px;
    margin:0;
    color:var(--ink);
    flex:1;
  }
  .chapter-tag{
    font-family:"IBM Plex Mono",monospace;
    font-size:11.5px;
    color:var(--ink-soft);
  }

  .card-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(400px,1fr));
    gap:18px;
  }
  .card-grid.single{ grid-template-columns:1fr; }

  /* ---------- Cards ---------- */
  .card{
    background:var(--surface);
    border:1px solid var(--rule);
    border-radius:var(--radius);
    padding:18px 18px 16px;
    box-shadow:var(--shadow);
    display:flex;
    flex-direction:column;
    gap:11px;
  }
  .card-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
  }
  .card-title{
    font-family:"IBM Plex Sans Condensed",sans-serif;
    font-weight:600;
    font-size:17.5px;
    color:var(--ink);
    margin:0;
  }
  .kind-badge{
    flex-shrink:0;
    font-family:"IBM Plex Mono",monospace;
    font-size:10.5px;
    font-weight:600;
    letter-spacing:.04em;
    text-transform:uppercase;
    padding:3px 8px;
    border-radius:5px;
    white-space:nowrap;
  }
  .kind-prompt{ background:var(--steel-tint); color:var(--steel-deep); }
  .kind-worksheet{ background:var(--safety-tint); color:var(--safety); }
  .kind-table{ background:var(--surface-2); color:var(--ink-soft); }
  .kind-checklist{ background:var(--surface-2); color:var(--ink-soft); }

  .chips{ display:flex; flex-wrap:wrap; gap:6px; }
  .chip{
    font-family:"IBM Plex Mono",monospace;
    font-size:11px;
    color:var(--ink-soft);
    background:var(--surface-2);
    padding:3px 8px;
    border-radius:5px;
  }

  .scenario{
    font-size:13.5px;
    color:var(--ink-soft);
    background:var(--paper);
    border:1px dashed var(--rule);
    border-radius:7px;
    padding:9px 11px;
  }
  .scenario b{ color:var(--ink); font-weight:600; }

  .promptbox{
    position:relative;
    background:var(--code-bg);
    border-radius:8px;
    padding:14px 44px 14px 14px;
  }
  .promptbox pre{
    margin:0;
    font-family:"IBM Plex Mono",monospace;
    font-size:12.8px;
    line-height:1.62;
    color:var(--code-ink);
    white-space:pre-wrap;
    word-break:keep-all;
    overflow-wrap:break-word;
  }
  .promptbox .fill{ color:var(--code-accent); }
  .copy-btn{
    position:absolute;
    top:10px; right:10px;
    appearance:none;
    border:1px solid rgba(255,255,255,.16);
    background:rgba(255,255,255,.06);
    color:var(--code-ink);
    font-family:"IBM Plex Mono",monospace;
    font-size:11px;
    font-weight:500;
    padding:6px 10px;
    border-radius:6px;
    cursor:pointer;
    transition:background .15s ease, border-color .15s ease;
  }
  .copy-btn:hover{ background:rgba(255,255,255,.14); border-color:rgba(255,255,255,.3);}
  .copy-btn:focus-visible{ outline:2px solid var(--safety); outline-offset:1px; }
  .copy-btn[data-copied="true"]{ background:var(--ok); border-color:var(--ok); color:#fff; }

  .card-note{
    font-size:12.8px;
    color:var(--ink-soft);
    border-top:1px solid var(--rule);
    padding-top:9px;
  }
  .card-note b{ color:var(--ink); }

  .worksheet-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-top:2px;
  }
  .worksheet-head b{
    font-size:12.8px;
    color:var(--ink);
    font-weight:600;
  }
  .copy-btn-inline{
    appearance:none;
    flex-shrink:0;
    border:1px solid var(--steel);
    background:var(--steel-tint);
    color:var(--steel-deep);
    font-family:"IBM Plex Mono",monospace;
    font-size:11px;
    font-weight:500;
    padding:5px 10px;
    border-radius:6px;
    cursor:pointer;
    transition:background .15s ease;
  }
  .copy-btn-inline:hover{ background:var(--steel); color:var(--surface); }
  .copy-btn-inline:focus-visible{ outline:2px solid var(--safety); outline-offset:1px; }
  .copy-btn-inline[data-copied="true"]{ background:var(--ok); border-color:var(--ok); color:#fff; }

  .steps{
    display:flex;
    flex-direction:column;
    gap:9px;
  }
  .step{
    display:grid;
    grid-template-columns:26px 1fr;
    gap:10px;
    align-items:start;
  }
  .step-num{
    width:26px; height:26px;
    border-radius:50%;
    background:var(--steel-tint);
    color:var(--steel-deep);
    font-family:"IBM Plex Mono",monospace;
    font-size:12px;
    font-weight:600;
    display:flex; align-items:center; justify-content:center;
  }
  .step-body{ font-size:13.5px; }
  .step-body .promptbox{ margin-top:6px; }

  table.data{
    width:100%;
    border-collapse:collapse;
    font-size:13px;
  }
  table.data th, table.data td{
    text-align:left;
    padding:7px 9px;
    border-bottom:1px solid var(--rule);
    font-variant-numeric:tabular-nums;
  }
  table.data th{
    font-family:"IBM Plex Mono",monospace;
    font-size:11px;
    letter-spacing:.03em;
    text-transform:uppercase;
    color:var(--ink-soft);
    font-weight:600;
  }
  table.data tr:last-child td{ border-bottom:none; }

  ul.checklist{
    list-style:none;
    margin:0; padding:0;
    display:flex; flex-direction:column; gap:7px;
    font-size:13.5px;
  }
  ul.checklist li{
    display:flex; gap:9px; align-items:flex-start;
  }
  ul.checklist li::before{
    content:"";
    flex-shrink:0;
    width:14px; height:14px;
    margin-top:2px;
    border:1.5px solid var(--ink-soft);
    border-radius:3px;
  }

  footer{
    max-width:1180px;
    margin:64px auto 0;
    padding:24px 24px 0;
    border-top:1px solid var(--rule);
    font-size:12.5px;
    color:var(--ink-soft);
    font-family:"IBM Plex Mono",monospace;
  }

  @media (max-width:640px){
    .card-grid{ grid-template-columns:1fr; }
    header.hero{ padding:40px 20px 28px; }
    .wrap, .sessions-inner{ padding-left:16px; padding-right:16px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }
</style>

<header class="hero">
  <div class="hero-inner">
    <div class="eyebrow">코비코(주) &nbsp;·&nbsp; ChatGPT 실무 교육</div>
    <h1>코비코 프롬프트 키트</h1>
    <p class="lede">1~3회차 교안에 나온 실습 프롬프트를 그대로 복사해 쓸 수 있게 모았습니다. 회차 탭을 고르고, 카드 오른쪽 위 복사 버튼을 누르면 됩니다.</p>
    <div class="hero-meta">
      <span><strong>3</strong>개 회차</span>
      <span><strong id="metaChapters">0</strong>개 챕터</span>

  </div>
</header>

<nav class="sessions" aria-label="회차 선택">
  <div class="sessions-inner" id="tabbar" role="tablist"></div>
</nav>

<main class="wrap">
  <div id="panels"></div>
</main>

<footer>
  코비코(주) ChatGPT 활용 교육 · 실습자료_대본 1~3번 문서 기준 정리 · 교육용 가상 데이터
</footer>

<script>
/* ============================================================
   DATA
   kind: prompt | worksheet | table | checklist | steps
   ============================================================ */
const DATA = [

  files: [],

/* ============================================================
   RENDER
   ============================================================ */
function esc(s){
  return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}
function highlightFill(text){
  return esc(text).replace(/\[([^\]]+)\]/g, '<span class="fill">[$1]</span>');
}

function renderPromptBox(text, uid){
  return `<div class="promptbox">
    <pre id="p-${uid}">${highlightFill(text)}</pre>
    <button class="copy-btn" type="button" data-target="p-${uid}">복사</button>
  </div>`;
}

function fieldsToText(fields){
  return fields.map(([k,v]) => `${k}: ${v}`).join("\n");
}

function renderInlineCopyHead(label, text){
  return `<div class="worksheet-head">
    <b>${esc(label)}</b>
    <button class="copy-btn-inline" type="button" data-copytext="${esc(encodeURIComponent(text))}">복사</button>
  </div>`;
}

let uidCounter = 0;

function renderCard(card){
  uidCounter++;
  const kindLabel = {prompt:"프롬프트", worksheet:"워크시트", table:"참고표", checklist:"체크리스트", steps:"단계별"}[card.kind] || "";
  let html = `<article class="card">
    <div class="card-top">
      <h4 class="card-title">${esc(card.title)}</h4>
      <span class="kind-badge kind-${card.kind}">${kindLabel}${card.tag ? " · " + esc(card.tag) : ""}</span>
    </div>`;

  if (card.chips && card.chips.length){
    html += `<div class="chips">${card.chips.map(c=>`<span class="chip">${esc(c)}</span>`).join("")}</div>`;
  }
  if (card.scenario){
    html += `<div class="scenario">${highlightFill(card.scenario).replace(/\n/g,"<br>")}</div>`;
  }

  if (card.kind === "table"){
    html += `<div style="overflow-x:auto"><table class="data"><thead><tr>${card.columns.map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>`;
    card.rows.forEach(r => { html += `<tr>${r.map(v=>`<td>${esc(v)}</td>`).join("")}</tr>`; });
    html += `</tbody></table></div>`;
    if (card.note) html += `<div class="card-note">${esc(card.note)}</div>`;
    if (card.prompt) html += renderPromptBox(card.prompt, uidCounter);
  }
  else if (card.kind === "worksheet"){
    html += renderInlineCopyHead("빈칸 채우기용", fieldsToText(card.fields));
    html += `<table class="data"><tbody>`;
    card.fields.forEach(([k,v]) => { html += `<tr><td style="width:64px;font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--steel-deep)">${esc(k)}</td><td>${esc(v)}</td></tr>`; });
    html += `</tbody></table>`;
    if (card.example){
      html += renderInlineCopyHead("작성 예시 · 지침으로 바로 등록", fieldsToText(card.example));
      html += `<table class="data">`;
      card.example.forEach(([k,v]) => { html += `<tr><td style="width:64px;font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--steel-deep)">${esc(k)}</td><td>${esc(v)}</td></tr>`; });
      html += `</table>`;
    }
  }
  else if (card.kind === "checklist"){
    html += `<ul class="checklist">${card.items.map(i=>`<li>${esc(i)}</li>`).join("")}</ul>`;
  }
  else if (card.kind === "steps"){
    html += `<div class="steps">`;
    card.steps.forEach(s => {
      uidCounter++;
      html += `<div class="step">
        <div class="step-num">${esc(s.label.replace(/[^0-9①②③④⑤]/g,'')) || '·'}</div>
        <div class="step-body"><b>${esc(s.label)}</b><br>${s.isPrompt ? renderPromptBox(s.body, uidCounter) : esc(s.body)}</div>
      </div>`;
    });
    html += `</div>`;
    if (card.note) html += `<div class="card-note">${esc(card.note)}</div>`;
  }
  else { // prompt
    if (card.note) html += `<div class="card-note">${esc(card.note)}</div>`;
    html += renderPromptBox(card.prompt, uidCounter);
  }

  html += `</article>`;
  return html;
}

  const tabbar = document.getElementById("tabbar");
  const panels = document.getElementById("panels");
  let totalChapters = 0, totalCards = 0;

  DATA.forEach((session, i) => {
    const btn = document.createElement("button");
    btn.className = "tab-btn";
    btn.type = "button";
    btn.role = "tab";
    btn.setAttribute("aria-selected", i === 0 ? "true" : "false");
    btn.dataset.target = session.id;
    const cardCount = session.chapters.reduce((a,c)=>a+c.cards.length,0);
    btn.innerHTML = `${esc(session.label)}<span class="count">${cardCount}</span>`;
    btn.addEventListener("click", () => activate(session.id));
    tabbar.appendChild(btn);

    totalChapters += session.chapters.length;
    totalCards += cardCount;

    const panel = document.createElement("section");
    panel.className = "panel" + (i === 0 ? " is-active" : "");
    panel.id = "panel-" + session.id;
    panel.setAttribute("role","tabpanel");

    let html = `<div class="session-intro">
      <h2>${esc(session.label)}</h2>
      <p>${esc(session.intro)}</p>
      ${session.files.length ? `<div class="files">${session.files.map(f=>`<span class="file-chip">${esc(f)}</span>`).join("")}</div>` : ""}
    </div>`;

    html += `<div class="chapter-jump">${session.chapters.map(c=>`<a href="#${c.id}">${esc(c.num)} · ${esc(c.title)}</a>`).join("")}</div>`;

    session.chapters.forEach(chapter => {
      html += `<div class="chapter" id="${chapter.id}">
        <div class="chapter-head">
          <span class="chapter-num">${esc(chapter.num)}</span>
          <h3>${esc(chapter.title)}</h3>
          <span class="chapter-tag">${chapter.cards.length}개</span>
        </div>
        <div class="card-grid">`;
      chapter.cards.forEach(card => { html += renderCard(card); });
      html += `</div></div>`;
    });

    panel.innerHTML = html;
    panels.appendChild(panel);
  });

  document.getElementById("metaChapters").textContent = totalChapters;
  document.getElementById("metaPrompts").textContent = totalCards;
}

function activate(id){
  document.querySelectorAll(".tab-btn").forEach(b => b.setAttribute("aria-selected", b.dataset.target === id ? "true" : "false"));
  document.querySelectorAll(".panel").forEach(p => p.classList.toggle("is-active", p.id === "panel-" + id));
  window.scrollTo({top: document.querySelector("nav.sessions").getBoundingClientRect().bottom + window.scrollY - 8, behavior:"instant"});
}

function legacyCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  let ok = false;
  try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
  document.body.removeChild(ta);
  return ok;
}

document.addEventListener("click", (e) => {
  const btn = e.target.closest(".copy-btn, .copy-btn-inline");
  if (!btn) return;
  const text = btn.dataset.copytext !== undefined
    ? decodeURIComponent(btn.dataset.copytext)
    : document.getElementById(btn.dataset.target).innerText;
  const original = btn.textContent;

  function showResult(ok){
    btn.textContent = ok ? "복사됨" : "복사 실패";
    btn.dataset.copied = ok ? "true" : "false";
    setTimeout(() => { btn.textContent = original; btn.dataset.copied = "false"; }, 1600);
  }

  if (navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(() => showResult(true)).catch(() => showResult(legacyCopy(text)));
  } else {
    showResult(legacyCopy(text));
  }
});

buildAll();
</script>
